apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: '{{ printf "%s-authz" (include "identity-service.fullname" .) }}'
spec:
  selector:
    matchLabels:
      {{- include "identity-service.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
    - from:
        - source:
            principals: {{ toJson (default (list) .Values.istio.authorization.internalCallers) }}
