apiVersion: security.istio.io/v1beta1
kind: AuthorizationPolicy
metadata:
  name: {{ include "identity-service.fullname" . }}-auth-policy
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    matchLabels:
      {{- include "identity-service.selectorLabels" . | nindent 6 }}
  action: ALLOW
  rules:
  - from:
    - source:
        principals:
        # Allow traffic from the API Gateway
        - "cluster.local/ns/{{ .Release.Namespace }}/sa/{{ .Values.apiGatewayFullname | default "api-gateway" }}"
        # Allow traffic from user-service if needed
        - "cluster.local/ns/{{ .Release.Namespace }}/sa/{{ .Values.userServiceFullname | default "user-service" }}"

  # New Rule for Public Endpoints
  - to:
    - operation:
        methods: ["GET", "POST", "PUT", "DELETE"]
        paths:
          - "/api/v1/auth/register/*"
          - "/api/v1/auth/register/**"
          - "/api/v1/auth/login"
          - "/api/v1/auth/refresh"
          - "/api/v1/auth/verify-otp"
          - "/api/v1/auth/password-reset/*"
          - "/v3/api-docs"
          - "/v3/api-docs/*"
          - "/swagger-ui/*"
          - "/swagger-ui.html"
          - "/actuator/*"
