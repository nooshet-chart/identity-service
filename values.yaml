# Default values for the Identity Service Helm chart

replicaCount: 1
image:
  repository: ghcr.io/nooshet-backend/identity-service
  tag: development-004909d
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-secret
service:
  type: ClusterIP
  port: 8080
ingress:
  enabled: false
  annotations: {}
  hosts:
    - host: identity.nooshet.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
resources:
  limits:
    memory: 512Mi
    cpu: 500m
  requests:
    cpu: 250m
    memory: 256Mi
autossl: {}
# Istio Configuration
istio:
  enabled: true
  # Optional authorization settings. `internalCallers` is a list of principals
  # allowed to call this service (used by AuthorizationPolicy). Keep empty by default.
  authorization:
    internalCallers: []
env:
  JWT_SECRET: "change-me-in-prod-please-use-a-longer-secret-key-123456"
  JWT_ISSUER: "nooshet"
  SPRING_PROFILES_ACTIVE: "dev"
  REDIS_HOST: "redis"
  REDIS_PORT: "6379"
  REDIS_TIMEOUT: "2000ms"
  USER_SERVICE_URL: "http://user-service:8080"
  JAVA_OPTS: "-XX:TieredStopAtLevel=1 -Xss256k -Xmx448m"
  MAIL_USERNAME: "nooshet.2025@gmail.com"
  MAIL_PASSWORD: "loza derr hxoa ruuj"
  
  # PostgreSQL connection environment variables
  SPRING_DATASOURCE_URL: "jdbc:postgresql://postgresql-identity:5432/nooshet_identity"
  SPRING_DATASOURCE_USERNAME: "nooshet_identity"
  SPRING_DATASOURCE_PASSWORD: 
    valueFrom:
      secretKeyRef:
        name: postgresql-identity-secret
        key: postgresql-password

database:
  host: "postgresql-identity"
  port: 5432
  name: "nooshet_identity"
  user: "nooshet_identity"
  secretName: "postgresql-identity-secret"
  secretKey: "postgresql-password"

redis:
  host: "redis"
  port: "6379"
