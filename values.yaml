# Default values for the Identity Service Helm chart

replicaCount: 1
image:
  repository: ghcr.io/nooshet-backend/identity-service
  tag: development-6364e1e
  pullPolicy: IfNotPresent
  imagePullSecrets:
    - name: ghcr-secret
service:
  type: ClusterIP
  port: 8080
ingress:
  enabled: true
  annotations: {}
  hosts:
    - host: identity.nooshet.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []
resources: {}
autossl: {}
# Istio Configuration
istio:
  enabled: true
env:
  application.config.user-service-url: "http://user-service:80"
