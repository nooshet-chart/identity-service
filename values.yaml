# Default values for the Identity Service Helm chart

replicaCount: 1

image:
  repository: nooshet/identity-service
  tag: latest
  pullPolicy: IfNotPresent

service:
  type: ClusterIP
  port: 80

ingress:
  enabled: true
  annotations: {}
  hosts:
    - host: identity.nooshet.local
      paths:
        - path: /
          pathType: ImplementationSpecific
  tls: []

resources: {}

autossl: {}
